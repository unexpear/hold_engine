[package]
name = "hold_engine"
version = "0.1.0"
edition = "2021"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "editor_host"
path = "examples/editor_host.rs"

[[example]]
name = "editor_shell"
path = "examples/editor_shell.rs"

[lib]
name = "hold"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
